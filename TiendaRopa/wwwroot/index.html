    <script>
        // Área segura: se aplica UNA sola vez por plataforma.
        // En Android los insets del sistema los aplica la ventana nativa
        // (Platforms/Android/MainActivity.cs), que deja el contenido debajo
        // de la barra de estado y por encima de la barra de navegación.
        // El CSS compartido usa env(safe-area-inset-*), así que aquí se le
        // avisa para que no vuelva a reservar ese espacio.
        // En iOS/MacCatalyst y Windows los resuelve el navegador con env().
        if (/Android/i.test(navigator.userAgent)) {
            document.documentElement.classList.add('vr-safe-area-native');
        }
    </script>
